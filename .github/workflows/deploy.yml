name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the scoring rules
        run: node tests/logic.test.mjs
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html 404.html logic.js firebase-config.js manifest.webmanifest robots.txt favicon.svg *.png _site/
      - name: Lighthouse report (informational)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./_site
          uploadArtifacts: true
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
